# TeaStore MESH-SEVER pair leg — wave-3a item 2 (plan rev 2.1, unanimous b0b5a54). Same spec for
# both legs; the leg is a plain VirtualService abort 503 on the persistence
# /tools.descartes.teastore.persistence/rest/orders prefix, with Istio sidecars TEMPORARILY on
# webui+auth (DEPLOY-SHAPE PARITY: BOTH legs run sidecars-on; the only variable is the VS).
# The T15/Phase-C rider verified the end-to-end mask live: the auth->persistence order create gets
# the 503, NonBalancedCRUDOperations swallows non-404/408 to -1L, placeOrder never checks it, the
# webui renders the confirmed page — acked-but-lost. Trace columns are PRE-REGISTERED EXCLUDED for
# this pair (2-sidecar fragments = injector artifacts + T2-unvalidatable; see the plan).
# SHARP EDGES (inherited from the maintenance pair): never GET /rest/generatedb (DB REGENERATION =
# wipe); users are pre-generated (shared demo password, redacted); fresh never-used userN + a
# distinct firstname marker per leg via --var; identity ledger: user11-17 consumed, this item uses
# user18 (control) / user19 (fault) / user20 (probes). Product 42 verified live.
# HARD GUARD (B-F2): no persistence/db restarts while any sidecar config exists (no-PVC wipe risk);
# maintenance flag verified false before/after the item.
case_id: teastore-order-meshsever-flow
sut: {name: teastore, version_ref: "TeaStore v1.4.2 @ kind 'mist' ns teastore (images pinned :1.4.2); app trace-uninstrumented; TEMPORARY Envoy sidecars on webui+auth for this pair"}
base_url: http://localhost:8082
cookie_session: true
steps:
  - method: POST
    path: /tools.descartes.teastore.webui/loginAction?username={user}&password={pw}
    redact: true
  - method: POST
    path: /tools.descartes.teastore.webui/cartAction?addToCart=&productid=42
  - method: POST
    path: /tools.descartes.teastore.webui/cartAction?firstname={marker}&lastname=Corpus&address1=Street1&address2=City1&cardtype=visa&cardnumber=314159265359&expirydate=12%2F2029&confirm=Confirm
observations:
  - probe: "GET the acting user's profile (orders table; in-window read — reads are NOT severed: the VS matches only the /rest/orders prefix on writes AND reads of orders; NOTE the in-window profile read may itself see the 503-severed orders list, recorded as-is)"
    path: /tools.descartes.teastore.webui/profile
    delay_ms: 2000
