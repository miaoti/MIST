# S2 benign — contacts dedupe (NATURAL, upstream; no fork). Adding the SAME contact twice: the 2nd
# POST returns {0,"Contacts already exists"} BY DESIGN (ContactsServiceImpl.createContacts dedupes on
# accountId+documentNumber+documentType); the durable state stays ONE contact. A status-0 "rejection"
# that is NOT a lost write — the benign trap (looks like a failed write, is by-design idempotent-reject).
# (Was blocked at 400: the earlier spec POSTed to /adminbasicservice/adminbasic/contacts, which has no
#  POST — contact creation is on the contacts-service.)
case_id: tt-s2-contacts-dedupe
sut: {name: trainticket, version_ref: "codewisdom 1.0.0"}
base_url: http://localhost:32677
gen_user: true
steps:
  - method: POST
    path: /api/v1/userservice/users/register
    redact: true
    payload: '{"userName":"{user}","password":"{pw}","gender":1,"documentType":1,"documentNum":"{docnum}","email":"{user}@corpus.test"}'
  - method: POST
    path: /api/v1/users/login
    redact: true
    payload: '{"username":"{user}","password":"{pw}"}'
    capture: {token: data.token, userId: data.userId}
    set_session: token
  - method: POST
    path: /api/v1/contactservice/contacts
    payload: '{"accountId":"{userId}","name":"CB Contact","documentType":1,"documentNumber":"D12345678","phoneNumber":"13800000000"}'
  - method: POST
    path: /api/v1/contactservice/contacts
    payload: '{"accountId":"{userId}","name":"CB Contact","documentType":1,"documentNumber":"D12345678","phoneNumber":"13800000000"}'
observations:
  - probe: 'GET the acting user contacts (durable dedupe read-back — exactly one contact expected)'
    path: '/api/v1/contactservice/contacts/account/{userId}'
    delay_ms: 1500
