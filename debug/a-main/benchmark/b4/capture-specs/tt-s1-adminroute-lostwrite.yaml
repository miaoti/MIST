# Stations must be REAL (zhenjiang/xuzhou pass the station validators; same body as the control).
case_id: tt-s1-adminroute-lostwrite
sut: {name: trainticket, version_ref: quickstart-codewisdom-1.0.0 + fork ts-admin-route-service:1.0.5 flag-on}
base_url: http://localhost:32677
login: {path: /api/v1/users/login, username: admin, password: "222222"}
steps:
  - method: POST
    path: /api/v1/adminrouteservice/adminroute
    payload: '{"id":"7c9d4f7e-1b2a-4c3d-9e8f-a5b6c7d8e9f0","startStation":"zhenjiang","endStation":"xuzhou","stationList":"zhenjiang,xuzhou","distanceList":"0,290"}'
observations:
