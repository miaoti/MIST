  # ---------------- ts-admin-travel-service (base /api/v1/admintravelservice; routes by tripId first char 'G'/'D' -> travel, else travel2) ----------------
  - service: ts-admin-travel-service
    endpoint: "POST /api/v1/admintravelservice/admintravel"
    success_response: "HTTP 200; re-wrapped {1,'[Admin add new travel]', null} when downstream status==1"
    state_postcondition: "trip appears in GET /admintravel (merged admin_trip data of travel+travel2)"
    failure_contract: "{0,'Admin add new travel failed', null} when downstream status!=1 — CAVEAT: downstream duplicate-create returns status 1 (travel quirk), so a duplicate add still reports SUCCESS here; only the follow-up GET can distinguish"
    notes: "Success msg string flagged: extraction quoted '[Admin add new travel]' verbatim; treat exact msg as low-confidence, status/data as firm."
  - service: ts-admin-travel-service
    endpoint: "PUT /api/v1/admintravelservice/admintravel"
    success_response: "HTTP 200; pass-through of downstream update envelope {1,'Update trip:...', trip} — but downstream not-found ALSO returns status 1 ('...doesn 't exists') and would pass through as success-status"
    state_postcondition: "GET /admintravel reflects the submitted trip fields"
    failure_contract: "{0,'Admin update travel failed', null} when downstream status!=1"
    notes: "Same travel-quirk caveat as POST."
  - service: ts-admin-travel-service
    endpoint: "DELETE /api/v1/admintravelservice/admintravel/{tripId}"
    success_response: "HTTP 200; pass-through {1,'Delete trip:'+tripId+'.', tripId}"
    state_postcondition: "trip absent from GET /admintravel"
    failure_contract: "{0,'Admin delete travel failed', null} when downstream returns status 0 (trip doesn't exist)"
    notes: ""

