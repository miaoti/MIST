  - service: ts-auth-service
    endpoint: "POST /api/v1/auth"
    success_response: "HTTP 201; {1,'SUCCESS', submitted AuthDto} — controller constructs this envelope unconditionally"
    state_postcondition: "created auth user (ROLE_USER, encoded password) can obtain a token via POST /api/v1/users/login; visible in GET /api/v1/users (list of auth users)"
    failure_contract: "No failure envelope in controller; impl validation (empty username/password, password <6 chars) throws UserOperationException whose HTTP manifestation is UNKNOWN from fetched code; NO duplicate-username check in this impl"
    notes: "Contract is response-shape-only; assert the state via login/user list."
  - service: ts-auth-service
    endpoint: "POST /api/v1/users/login"
    success_response: "HTTP 200; {1, msg (exact string not captured — UNKNOWN), TokenDto{userId, username, token}}"
    state_postcondition: "none — token issuance only; no documented persistent-state change (include as response contract only)"
    failure_contract: "HTTP 200; {0,'get token error', null} on bad credentials / token failure"
    notes: "Not state-mutating; listed because it is a POST on a covered service."
  - service: ts-auth-service
    endpoint: "DELETE /api/v1/users/{userId}"
    success_response: "HTTP 200; {1,'DELETE USER SUCCESS', null}"
    state_postcondition: "auth user gone from GET /api/v1/users; login with those credentials returns {0,'get token error', null}"
    failure_contract: "No not-found branch in source: unknown userId still yields {1,'DELETE USER SUCCESS', null} (silent no-op)"
    notes: ""

