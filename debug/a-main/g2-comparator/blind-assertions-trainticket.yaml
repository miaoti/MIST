provisioning_manifest:
  repo: github.com/FudanSELab/train-ticket
  ref: "master @ 313886e99befb94be6cd45f085c98e0019f59829 (HEAD of default branch 'master' at fetch time; commit 'Hotfix (#243)', authored 2022-11-01; repo pushed_at 2025-11-21 reflects non-master branches)"
  fetched: "2026-07-02"
  method: "GitHub API (repos/, git/trees with recursive per-module listing) + raw.githubusercontent.com file fetches, all pinned to commit 313886e. No local files read."
  envelope: "All controllers return edu.fudan.common.util.Response<T>{Integer status (source comment: '1 true, 0 false'), String msg, T data} (verified in ts-common/src/main/java/edu/fudan/common/util/Response.java), wrapped in ResponseEntity."
  coverage:
    covered_full: [ts-station-service, ts-route-service, ts-train-service, ts-contacts-service,
      ts-order-service, ts-order-other-service, ts-config-service, ts-travel-service,
      ts-travel2-service, ts-price-service, ts-food-service, ts-consign-service,
      ts-consign-price-service, ts-user-service, ts-auth-service, ts-assurance-service,
      ts-security-service, ts-admin-basic-info-service, ts-admin-order-service,
      ts-admin-route-service, ts-admin-travel-service, ts-admin-user-service]
    not_covered: [ts-avatar-service, ts-basic-service, ts-cancel-service, ts-delivery-service,
      ts-execute-service, ts-food-delivery-service, ts-gateway-service, ts-inside-payment-service,
      ts-news-service, ts-notification-service, ts-payment-service, ts-preserve-service,
      ts-preserve-other-service, ts-rebook-service, ts-route-plan-service, ts-seat-service,
      ts-station-food-service, ts-ticket-office-service, ts-train-food-service,
      ts-travel-plan-service, ts-ui-dashboard, ts-verification-code-service,
      ts-voucher-service, ts-wait-order-service, ts-common(library)]
  global_caveats:
    - "HTTP status rarely signals outcome. Most mutating endpoints return 200 via ok() on BOTH success and business failure; outcome is carried in the envelope (status 1 vs 0). The endpoints that return 201 CREATED (station create, contacts create x2, config create, price create, travel/travel2 create, user register, auth create) return 201 UNCONDITIONALLY, including on business rejection."
    - "ts-travel / ts-travel2 quirk (verified in both impls): create-on-duplicate and update-on-missing return envelope status 1 with a failure msg ('... already exists' / '...doesn 't exists' [sic]); for these, outcome must be asserted on msg/data + a follow-up GET, not on status."
    - "Exact msg strings below were extracted from the fetched sources via automated summarization; envelope status and data shape are the primary assertions, msg equality secondary. Entries where two extraction passes disagreed are flagged in notes."
    - "Per-endpoint authorization (Spring Security roles) was not extracted; all contracts assume an authorized caller. Behavior on malformed JSON/type errors (Spring default 4xx/5xx) is outside these contracts."
    - "Assertions assume a single-writer test context (no concurrent mutation between the call and the verifying GET)."

assertions:
  # ---------------- ts-station-service (base /api/v1/stationservice) ----------------
  - service: ts-station-service
    endpoint: "POST /api/v1/stationservice/stations"
    success_response: "HTTP 201 (unconditional); envelope {status:1, msg:'Create success', data:=submitted station (name, stayTime)}"
    state_postcondition: "GET /api/v1/stationservice/stations returns status 1 and its data list contains a station with the submitted name and stayTime; GET /api/v1/stationservice/stations/id/{name} returns {status:1, msg:'Success', data:=that station's id}"
    failure_contract: "HTTP 201 still; {0,'Name not specify', submitted station} when name empty; {0,'Already exists', submitted station} when a station with that name exists (uniqueness key = name)"
    notes: "Whether id is client-supplied or generated was not established from the fetched code (UNKNOWN) — assert by name, not id."
  - service: ts-station-service
    endpoint: "PUT /api/v1/stationservice/stations"
    success_response: "HTTP 200; {1,'Update success', updated station}"
    state_postcondition: "GET /stations list shows the station with matching id carrying the new name/stayTime; GET /stations/name/{id} returns the new name"
    failure_contract: "HTTP 200; {0,'Station not exist', null} when no station with submitted id"
    notes: ""
  - service: ts-station-service
    endpoint: "DELETE /api/v1/stationservice/stations/{stationsId}"
    success_response: "HTTP 200; {1,'Delete success', deleted station}"
    state_postcondition: "station id absent from GET /stations data; GET /stations/name/{stationsId} returns {0,'No that stationId', stationsId}"
    failure_contract: "HTTP 200; {0,'Station not exist', null} when id unknown"
    notes: "POST /stations/idlist and /stations/namelist are query-POSTs (read-only), not state-mutating."

  # ---------------- ts-route-service (base /api/v1/routeservice) ----------------
  - service: ts-route-service
    endpoint: "POST /api/v1/routeservice/routes  (create-or-modify)"
    success_response: "HTTP 200; {1,'Save and Modify success', saved Route} — data.id is a fresh UUID when submitted id is null/len<32, otherwise the submitted id; data.stations/distances are the comma-separated inputs parsed into lists; startStation/endStation echo input"
    state_postcondition: "GET /api/v1/routeservice/routes/{data.id} returns {1,'Success', route} with identical stations/distances/start/end; route present in GET /api/v1/routeservice/routes"
    failure_contract: "HTTP 200; {0,'Station Number Not Equal To Distance Number', null} when |stations| != |distances|"
    notes: "Upsert semantics: same endpoint modifies an existing route when a full-length id is supplied."
  - service: ts-route-service
    endpoint: "DELETE /api/v1/routeservice/routes/{routeId}"
    success_response: "HTTP 200; {1,'Delete Success', routeId}"
    state_postcondition: "GET /routes/{routeId} returns {0,'No content with the routeId', null}; id absent from GET /routes"
    failure_contract: "HTTP 200; {0,'Delete failed, Reason unKnown with this routeId', routeId} only if the route still exists after the delete attempt"
    notes: "Success is decided by a post-delete existence re-check, so deleting a NON-EXISTENT id also returns 'Delete Success' (idempotent-success)."

