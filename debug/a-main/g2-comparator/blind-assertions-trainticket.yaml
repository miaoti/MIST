  - service: ts-admin-order-service
    endpoint: "PUT /api/v1/adminorderservice/adminorder"
    success_response: "HTTP 200; pass-through {1,'Admin Update Order Success', order} (G/D) or {1,'Success', order} (other)"
    state_postcondition: "GET /adminorder reflects the updated fields for that order id"
    failure_contract: "pass-through {0,\"Order Not Found, Can't update\"|'Order Not Found', null}"
