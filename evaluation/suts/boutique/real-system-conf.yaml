testConfiguration:
  services:
    frontend:
    - expectedResponse: 200
      method: get
      operationId: home
      testPath: /
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: healthz
      testPath: /_healthz
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: viewCart
      testPath: /cart
      testParameters: null
    - expectedResponse: 200
      method: post
      operationId: addToCart
      testPath: /cart
      requestContentType: application/x-www-form-urlencoded
      testParameters:
      - name: product_id
        in: formData
        weight: null
        description: product id to add
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: quantity
        in: formData
        weight: null
        description: quantity to add
        type: integer
        format: int32
        minimum: !!float '1'
        maximum: !!float '10'
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
    - expectedResponse: 200
      method: post
      operationId: placeOrder
      testPath: /cart/checkout
      requestContentType: application/x-www-form-urlencoded
      testParameters:
      - name: email
        in: formData
        weight: null
        description: buyer email
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: street_address
        in: formData
        weight: null
        description: null
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: zip_code
        in: formData
        weight: null
        description: null
        type: integer
        format: int32
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
      - name: city
        in: formData
        weight: null
        description: null
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: state
        in: formData
        weight: null
        description: null
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: country
        in: formData
        weight: null
        description: null
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: credit_card_number
        in: formData
        weight: null
        description: 16-digit card number
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: credit_card_expiration_month
        in: formData
        weight: null
        description: null
        type: integer
        format: int32
        minimum: !!float '1'
        maximum: !!float '12'
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
      - name: credit_card_expiration_year
        in: formData
        weight: null
        description: null
        type: integer
        format: int32
        minimum: !!float '2024'
        maximum: !!float '2039'
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
      - name: credit_card_cvv
        in: formData
        weight: null
        description: null
        type: integer
        format: int32
        minimum: !!float '100'
        maximum: !!float '9999'
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
    - expectedResponse: 200
      method: post
      operationId: emptyCart
      testPath: /cart/empty
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: logout
      testPath: /logout
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: getProduct
      testPath: /product/{id}
      testParameters:
      - name: id
        in: path
        weight: null
        description: product id (e.g. OLJCESPC7Z)
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
    - expectedResponse: 200
      method: post
      operationId: setCurrency
      testPath: /setCurrency
      requestContentType: application/x-www-form-urlencoded
      testParameters:
      - name: currency_code
        in: formData
        weight: null
        description: ISO currency code
        type: string
        enumValues:
        - USD
        - EUR
        - GBP
        - CAD
        - JPY
        - TRY
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
