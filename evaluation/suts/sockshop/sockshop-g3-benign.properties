# =============================================================================
# Sock Shop — G3 β-phase BENIGN FP PROBE run config (SUT-2, prereg C-pin 4)
# =============================================================================
# sockshop-demo.properties (the generalization config) + the pre-registered probe
# deltas. Purpose: the per-SUT benign probe N=30 under bar v2 — every acked benign
# write must appear on its own read-back; FP reported as the interval
# [observed-gated/acked, fires/acked] + gate histogram; NOT_EVALUABLE (never PASS)
# when the observation gate is degraded. Quiescence knobs carried from Gate-1
# UNCHANGED (500 ms / 10 s / 3 s). Registry: target-triples.yaml beside this file
# (SS-B addresses+cards, benign-trap-only, readback_bound per R1fix).
# =============================================================================

api=SockShop
generator=MST

testsperoperation=20

oas.path=openapi/sockshop-swagger.yaml
conf.path=real-system-conf.yaml
trace.file.path=traces

test.target.dir=mist-cli/src/test/java
test.target.package=sockshop_g3
experiment.name=sockshop_g3_benign
testclass.name=SockShopG3BenignTest

experiment.execute=true
allure.report=true
testcases.check=false
deletepreviousresults=true
coverage.input=false
coverage.output=false
stats.csv=true

numtotaltestcases=-1
max.iterations=1
delay=-1

# BENIGN: no negative tests in the probe run (G1 pairing-config convention).
faulty.ratio=0.0
faulty.dependency.ratio=0.0
reloadinputdataevery=50
inputdatamaxvalues=500

base.url=http://localhost:8080

logToFile=true
data.log.dir=logs
data.log.file=sockshop_g3_benign_execution

# -------- MST step generation --------
mst.generate.only.first.step=true
test.variants.per.scenario=10
faulty.round-robin=true
negative.input.generation.mode=smart

trace.merge.max.session.gap.micros=60000000
trace.merge.max.roots.per.scenario=10

root.api.registry.enabled=true
root.api.registry.path=root-api-registry.json

fault.detection.enabled=true
fault.detection.report.dir=logs/fault-detection-reports

http.connect.timeout.ms=10000
http.socket.timeout.ms=30000

# -------- Auth: cookie-session (SUT-2 engineering item iii; MstAuthHandler
# per_jvm_cookie, live-smoked). Register-as-login: one POST /register per JVM with a
# ${unique} per-JVM username; the response's session cookies (logged_in + md.sid) are
# cached and attached to every request. /register + /login themselves are exercised by
# the generated suite as tested ops — skip cookie attachment there so a random tested
# register never runs inside (or replaces) the probe session.
auth.mode=per_jvm_cookie
auth.login.url=/register
auth.login.username=mistg3${unique}
auth.login.password=mistg3pw
auth.login.body.template={"username":"${username}","password":"${password}","email":"${username}@mist.test","firstName":"m","lastName":"t"}
auth.login.expected.status=200
auth.skip.path.patterns=/register,/login

# -------- Data-integrity oracle + the pre-registered benign FP probe --------
mst.oracle.dataintegrity.enabled=true
# Arms the target-triple registry (read only when true); the SS triples are
# benign-trap-only (no fault_flag) per branch β — nothing is ever injected.
mist.fault.injection.enabled=true
# Pre-registered quiescence (carried from Gate-1, unchanged per C-pin 4):
mst.oracle.dataintegrity.poll.ms=500
mst.oracle.dataintegrity.timeout.ms=10000
mst.oracle.dataintegrity.trace.settle.ms=3000
# B2.4 benign FP probe — pre-registered N=30.
mst.oracle.dataintegrity.fpprobe.runs=30

# -------- LLM (generation; same as the validated generalization run) --------
llm.enabled=true
llm.model.type=openai_compatible
mist.llm.cache.read=auto
mist.llm.cache.write=true
llm.openai_compatible.url=https://api.deepseek.com/v1/chat/completions
llm.openai_compatible.model=deepseek-chat
llm.openai_compatible.api.key=${DEEPSEEK_API_KEY}
llm.rate.limit.retry.enabled=true
llm.rate.limit.max.retries=3
llm.seed.count=5

llm.communication.logging.enabled=true
llm.communication.logging.dir=logs/llm-communications
llm.communication.logging.file.prefix=llm-communication
llm.communication.logging.include.content=true
llm.communication.logging.level=INFO
llm.communication.logging.max.content.length=-1

llm.response.validation.enabled=true
llm.response.validation.only.2xx=true
llm.response.validation.include.rca=true
soft.error.cache.enabled=true

jaeger.enabled=true
jaeger.base.url=http://localhost:16686/jaeger/api
jaeger.lookback=10m

smart.input.fetch.enabled=true
smart.input.fetch.percentage=1.0
smart.input.fetch.registry.path=input-fetch-registry.yaml
smart.input.fetch.llm.discovery.enabled=true
smart.input.fetch.max.candidates=5
smart.input.fetch.dependency.resolution.enabled=true
smart.input.fetch.discovery.timeout.ms=5000
smart.input.fetch.cache.enabled=true
smart.input.fetch.cache.ttl.seconds=300

# -------- Probe purity: enhancer + status-code exploration OFF (G1 convention) --------
test.enhancer.enabled=false
status.code.exploration.enabled=false

verbose.parameter.generation=true
verbose.test.case.creation=true
logging.level.root=INFO

mst.oracle.shape.invariants.hidden_downstream_failure.enabled=true
